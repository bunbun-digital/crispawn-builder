[package]
name = "crispawn-builder-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
crispawn-builder-core = { path = "../crates/builder-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
