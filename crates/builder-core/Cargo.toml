[package]
name = "crispawn-builder-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
xz2 = "0.1.7"

[[bin]]
name = "crispawn-builder"
path = "src/main.rs"
